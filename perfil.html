        </aside>


        <!-- =========================
            PERFIL
        ========================== -->

        <main class="main">

            <div class="profile">


                <!-- =========================
                    INFORMACIÓN DEL PERFIL
                ========================== -->

                <section class="profile-header">

                    <!-- FOTO -->

                    <div class="profile-photo">
                        <span>Foto</span>
                    </div>


                    <!-- INFORMACIÓN -->

                    <div class="profile-info">

                        <!-- Nombre -->

                        <div class="profile-name">

                            <h1>usuario</h1>

                        </div>


                        <!-- Estadísticas -->

                        <div class="profile-stats">

                            <div>
                                <strong>25</strong>
                                <span>publicaciones</span>
                            </div>

                            <div>
                                <strong>120</strong>
                                <span>seguidores</span>
                            </div>

                            <div>
                                <strong>85</strong>
                                <span>seguidos</span>
                            </div>

                        </div>


                        <!-- Nombre real -->

                        <div class="profile-real-name">
                            Usuario
                        </div>


                        <!-- Descripción -->

                        <p class="profile-description">
                            Descripcion
                        </p>


                        <!-- Botón -->

                        <button class="follow-button">
                            Seguir
                        </button>

                    </div>

                </section>


                <!-- =========================
                    PUBLICACIONES
                ========================== -->

                <section class="profile-posts">

                    <h2>Publicaciones</h2>


                    <div class="posts-grid">


                        <!-- PUBLICACIÓN 1 -->

                        <article class="grid-post">

                            <img src="https://picsum.photos/600/600?random=1"
                                alt="Publicación de Usuario">

                        </article>


                        <!-- PUBLICACIÓN 2 -->

                        <article class="grid-post">

                            <img src="https://picsum.photos/600/600?random=2"

                        </article>


                        <!-- PUBLICACIÓN 3 -->

                        <article class="grid-post">

                            <img src="https://picsum.photos/600/600?random=3"
                                alt="Publicación de Usuario">

                        </article>


                        <!-- PUBLICACIÓN 4 -->

                        <article class="grid-post">

                            <img src="https://picsum.photos/600/600?random=4"
                                alt="Publicación de Usuario">

                        </article>


                        <!-- PUBLICACIÓN 5 -->

                        <article class="grid-post">

                            <img src="https://picsum.photos/600/600?random=5"
                                alt="Publicación de Usuario">

                        </article>


                        <!-- PUBLICACIÓN 6 -->

                        <article class="grid-post">

                            <img src="https://picsum.photos/600/600?random=6"
                                alt="Publicación de Usuario">

                        </article>

                    </div>

                </section>

            </div>
