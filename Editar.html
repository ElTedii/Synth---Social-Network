<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Crear cuenta</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
        <!-- CSS del login -->
        <link rel="stylesheet" href="Styles/login.css">
    </head>

    <body>
        <main class="login-container">
            <div class="login-box">
                <!-- Título -->
                <h1>Editar datos</h1>
                <!-- Formulario -->
                <form action="php/procesar_edicion.php" method="POST" enctype="multipart/form-data">
                    <!-- Nombre -->
                    <div class="input-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ingresa el nuevo nombre" maxlength="100">
                    </div>
                    <!-- Correo -->
                    <div class="input-group">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" name="correo" placeholder="Ingresa el correo" maxlength="150">
                    </div>
                    <!-- Contraseña -->
                    <div class="input-group">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu nueva contraseña"
                            minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
                            title="Mínimo 8 caracteres, con una mayúscula, una minúscula, un número y un carácter especial.">
                        <!--required para cuando se quiera validar-->
                    </div>
                    <!-- Imagen de perfil -->
                    <div class="input-group">
                        <label for="imagen_perfil"> Imagen de perfil</label>
                        <input type="file" id="imagen_perfil" name="imagen_perfil" accept="image/png, image/jpeg">
                    </div>
                    <!-- Aqui ira el boton , de momento solo esta el href -->
                    <a href="login.html" class="login-button login-button--secondary">Aceptar</a>
                </form>
            </div>
        </main>
    </body>

</html>
