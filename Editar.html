```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar datos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="Styles/login.css">
</head>

<body>
    <main class="login-container">
        <div class="login-box">

            <h1>Editar datos</h1>

            <form action="php/procesar_edicion.php"
                  method="POST"
                  enctype="multipart/form-data">

                <div class="input-group">
                    <label for="nombre">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresa el nuevo nombre"
                        maxlength="100"
                        required>
                </div>

                <div class="input-group">
                    <label for="correo">Correo</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="Ingresa el correo"
                        maxlength="150"
                        required>
                </div>

                <div class="input-group">
                    <label for="contrasena">
                        Nueva contraseña (opcional)
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Deja vacío para conservarla"
                        minlength="8"
                        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
                        title="Mínimo 8 caracteres, con mayúscula, minúscula, número y carácter especial.">
                </div>

                <div class="input-group">
                    <label for="imagen_perfil">
                        Imagen de perfil (opcional)
                    </label>

                    <input
                        type="file"
                        id="imagen_perfil"
                        name="imagen_perfil"
                        accept="image/png, image/jpeg">
                </div>

                <button type="submit" class="login-button">
                    Aceptar
                </button>

                <a href="miperfil.html"
                   class="login-button login-button--secondary">
                    Cancelar
                </a>

            </form>
        </div>
    </main>
</body>

</html>
```
